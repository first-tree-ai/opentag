name: Unit Coverage

on:
  # Measure main after every merge that can move coverage, so a floor breach is attributed to the
  # merge that caused it instead of turning the next unrelated pull request red. The weekly run stays
  # as a backstop for changes outside these paths (for example a toolchain update).
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "vitest.coverage.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/unit-coverage.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push run is never cancelled mid-measurement: with frequent merges that would leave main
  # unmeasured. GitHub keeps at most one pending run per group, so a burst of merges queues only the
  # newest commit behind the running one.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  measure:
    name: Measure Unit Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Measure unit coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage-report-${{ github.sha }}
          path: coverage/unit/**
          if-no-files-found: warn
          retention-days: 14
