  <text x="345" y="86" class="m" font-size="10.5">4:11 PM</text>
  <rect x="310" y="94" width="316" height="30" rx="9" fill="#EFF0E9"/>
  <text x="326" y="113" font-size="12.5"><tspan class="b6 g">@OpenTag</tspan><tspan class="t"> signup button is dead on mobile.</tspan></text>

  <circle cx="290" cy="158" r="11" fill="#8FDD14"/>
  <text x="290" y="162" class="b7" font-size="10" fill="#16211B" text-anchor="middle">O</text>
  <text x="310" y="154" class="b6 t" font-size="11.5">OpenTag</text>
  <rect x="364" y="145" width="30" height="13" rx="4" fill="#E9EBDE"/>
  <text x="379" y="155" class="b7 m" font-size="8" text-anchor="middle">BOT</text>
  <text x="402" y="154" class="m" font-size="10.5">4:11 PM</text>

  <rect x="310" y="164" width="360" height="86" rx="11" fill="#FFFFFF" stroke="#E0E2D3"/>
  <rect x="326" y="180" width="14" height="14" rx="4" fill="#16211B"/>
