name: GitHub Native Proxy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-native-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-gh:
    name: Native gh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Download the pinned official gh without using host credentials
        shell: bash
        run: |
          version=$(node --input-type=module -e 'import {RUNNER_PINS} from "./scripts/runner/pins.mjs"; process.stdout.write(RUNNER_PINS.gh.version)')
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) target=linux_amd64; extension=tar.gz ;;
            Darwin/arm64) target=macOS_arm64; extension=zip ;;
            Darwin/x86_64) target=macOS_amd64; extension=zip ;;
            *) exit 1 ;;
          esac
          archive="gh_${version}_${target}.${extension}"
          root="$RUNNER_TEMP/opentag-native-gh"
          mkdir -p "$root"
          curl --fail --location --retry 2 "https://github.com/cli/cli/releases/download/v${version}/${archive}" -o "$root/$archive"
          curl --fail --location --retry 2 "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_checksums.txt" -o "$root/checksums.txt"
          cd "$root"
          awk -v file="$archive" '$2 == file' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          shasum -a 256 -c selected-checksum.txt
          if [ "$extension" = zip ]; then unzip -q "$archive"; else tar -xzf "$archive"; fi
          binary="$root/gh_${version}_${target}/bin/gh"
          chmod +x "$binary"
          "$binary" --version
          echo "OPENTAG_TEST_GH_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Local and Cloud authority, transport and native command regressions
        shell: bash
        run: |
          pnpm --filter @opentag/client exec vitest run src/__tests__/github-native-gh.test.ts src/__tests__/runtime-credential-relay.test.ts src/__tests__/cloud-sandbox-credential-bridge.test.ts src/__tests__/cloud-turns-bridge-failure.test.ts --maxWorkers=1
          pnpm --filter @opentag/server exec vitest run src/__tests__/github-native-gh.test.ts src/__tests__/github-graphql-identities.test.ts src/__tests__/github-cli-schema.test.ts src/__tests__/github-cli-project-error.test.ts src/__tests__/github-graphql-policy.test.ts src/__tests__/github-provider-adapter.test.ts src/__tests__/github-runtime-policy.test.ts src/__tests__/github-user-token-client.test.ts --maxWorkers=1
