# Production deployment for OpenTag, running the published GHCR server image alongside PostgreSQL.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Compose resolves the values below from the shell environment and from a `.env` file in this
# directory. `.env` is gitignored; never commit real secrets. Variables marked required abort the
# command with a named error instead of starting a partially configured deployment.
#
# Required:
#   OPENTAG_POSTGRES_PASSWORD  password for the bundled PostgreSQL service
#   OPENTAG_DATABASE_URL       PostgreSQL URL the server connects with; percent-encode the password
#   OPENTAG_JWT_SECRET         at least 32 characters
#   OPENTAG_ENCRYPTION_KEY     canonical base64 of exactly 32 bytes, from `openssl rand -base64 32`
#   OPENTAG_PUBLIC_URL         externally reachable https origin, without path, query, or fragment
#
# Optional, omitted from the container when unset so the server applies its own default:
#   OPENTAG_IMAGE                      published image reference, default below
#   OPENTAG_HTTP_BIND                  host address the server port publishes on, default 127.0.0.1:8000
#   OPENTAG_POSTGRES_USER              default opentag
#   OPENTAG_POSTGRES_DB                default opentag
#   OPENTAG_AUTO_MIGRATE               "true" or "false" exactly, server default "true"
#   OPENTAG_ACCESS_TOKEN_TTL_SECONDS   server default 900
#   OPENTAG_REFRESH_TOKEN_TTL_SECONDS  server default 2592000
#   OPENTAG_GOOGLE_CLIENT_ID           set together with OPENTAG_GOOGLE_CLIENT_SECRET or not at all
#   OPENTAG_GOOGLE_CLIENT_SECRET
#
# The project name is pinned so this deployment never shares containers, networks, or volumes with
# the development `docker-compose.yml` in the same directory.
name: opentag-prod

x-opentag-image: &opentag-image ${OPENTAG_IMAGE:-ghcr.io/first-tree-ai/opentag:latest}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OPENTAG_POSTGRES_DB:-opentag}
      POSTGRES_USER: ${OPENTAG_POSTGRES_USER:-opentag}
      POSTGRES_PASSWORD: ${OPENTAG_POSTGRES_PASSWORD:?set OPENTAG_POSTGRES_PASSWORD to a strong secret}
    # The port is deliberately not published; only services on this network reach the database.
    volumes:
      - opentag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENTAG_POSTGRES_USER:-opentag} -d ${OPENTAG_POSTGRES_DB:-opentag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    image: *opentag-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The image already pins OPENTAG_ENV=production, OPENTAG_HOST=0.0.0.0 and OPENTAG_PORT=8000.
    # Do not override them here: OPENTAG_ENV=production is what requires an https public URL and
    # issues Secure cookies, OPENTAG_HOST=0.0.0.0 keeps the server reachable from outside the
    # container, and the image HEALTHCHECK addresses port 8000 directly. Remap on the host instead.
    environment:
      - &database-url OPENTAG_DATABASE_URL=${OPENTAG_DATABASE_URL:?set OPENTAG_DATABASE_URL to the PostgreSQL URL}
      - OPENTAG_JWT_SECRET=${OPENTAG_JWT_SECRET:?set OPENTAG_JWT_SECRET to at least 32 random characters}
      - OPENTAG_ENCRYPTION_KEY=${OPENTAG_ENCRYPTION_KEY:?set OPENTAG_ENCRYPTION_KEY to a base64 32-byte key}
      - OPENTAG_PUBLIC_URL=${OPENTAG_PUBLIC_URL:?set OPENTAG_PUBLIC_URL to the public https origin}
      - OPENTAG_AUTO_MIGRATE
      - OPENTAG_ACCESS_TOKEN_TTL_SECONDS
      - OPENTAG_REFRESH_TOKEN_TTL_SECONDS
      - OPENTAG_GOOGLE_CLIENT_ID
      - OPENTAG_GOOGLE_CLIENT_SECRET
    # Terminate TLS in a reverse proxy in front of this port and serve it at OPENTAG_PUBLIC_URL.
    ports:
      - "${OPENTAG_HTTP_BIND:-127.0.0.1:8000}:8000"
    # The image ships a /healthz liveness probe. This deployment reports readiness instead, so the
    # container only counts as healthy once configuration, migration, and the listener all succeeded.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # One-shot migration runner for controlled rollouts. It is not started by `up`. While
  # OPENTAG_AUTO_MIGRATE is "true" (the default) the server migrates under an advisory lock before
  # it listens, so this service is unnecessary. Set OPENTAG_AUTO_MIGRATE=false to make the server
  # verify migrations and refuse to start on a database that is empty, behind, or diverged, then
  # apply them explicitly before each deploy:
  #   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
  migrate:
    image: *opentag-image
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - *database-url
    command: ["node", "packages/server/dist/db/migrate-cli.mjs"]
    # This container never listens, so the inherited HTTP health probe would always fail.
    healthcheck:
      disable: true

volumes:
  opentag-postgres-data:
