name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  PRIMARY_NODE_VERSION: "24"
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  # Every run owns the commit-SHA coordinate for its revision, so no run may be cancelled by a later
  # push. The group is keyed on the revision because GitHub also cancels a pending run once a newer
  # run queues into the same group, which would drop the image of a commit that landed between two
  # other pushes. Runs therefore overlap, and the mutable pointers are moved by a serialised job.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Commit Image
    if: github.repository == 'first-tree-ai/opentag'
    runs-on: ubuntu-latest
    outputs:
      # The digest every other coordinate is derived from. Reusing an already published image keeps
      # the commit-SHA coordinate immutable across re-runs instead of replacing it with a rebuild.
      digest: ${{ steps.commit.outputs.present == 'true' && steps.commit.outputs.digest || steps.build.outputs.digest }}
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate production release coordinate
        if: github.ref_type == 'tag'
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REPOSITORY_VISIBILITY" != "public" ]; then
            echo "Production images require a public source repository" >&2
            exit 1
          fi
          SOURCE_VERSION=$(node -p "require('./apps/cli/package.json').version")
          node scripts/release-versions.mjs \
            --channel prod \
            --source-version "$SOURCE_VERSION" \
            --tag "$TAG_NAME"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Production tag must point to a commit in main history" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Reject an already published release coordinate
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Fail before the build rather than after it. The authoritative check runs again in the
          # release job, immediately before the coordinate is created.
          node scripts/registry-coordinate.mjs --image "$IMAGE" --reference "${TAG_NAME#v}" --require-absent

      - name: Look up the commit coordinate
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/registry-coordinate.mjs --image "$IMAGE" --reference "$GITHUB_SHA"

      - name: Set up Docker Buildx
        if: steps.commit.outputs.present != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: steps.commit.outputs.present != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        if: steps.commit.outputs.present != 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # This job publishes one coordinate only. Every other coordinate is a retag of the digest
          # below, so a release image is the same bytes CI already exercised on main.
          flavor: latest=false
          tags: type=raw,value=${{ github.sha }}

      - name: Build and publish image
        id: build
        if: steps.commit.outputs.present != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=server-image
          cache-to: ${{ github.ref_type == 'branch' && 'type=gha,mode=max,scope=server-image' || '' }}

      - name: Summarise the commit image
        env:
          REUSED: ${{ steps.commit.outputs.present }}
          DIGEST: ${{ steps.commit.outputs.present == 'true' && steps.commit.outputs.digest || steps.build.outputs.digest }}
        run: |
          # Tags are pointers; the digest is the only byte-for-byte pin.
          {
            echo "### Commit image"
            echo
            printf -- "- Digest: \`%s@%s\`\n" "$IMAGE" "$DIGEST"
            printf -- "- Commit coordinate: \`%s:%s\`\n" "$IMAGE" "$GITHUB_SHA"
            if [ "$REUSED" = "true" ]; then
              echo "- Reused the image already published for this revision; nothing was rebuilt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish Release Coordinate
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Deliberately left on the workflow-level per-revision group. A release coordinate is immutable
    # and must never be dropped, and a shared group would let GitHub cancel this job while it is
    # pending because a different release queued behind it.
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Reject an already published release coordinate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/registry-coordinate.mjs --image "$IMAGE" --reference "${TAG_NAME#v}" --require-absent

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release coordinate
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:${TAG_NAME#v}" "$IMAGE@$DIGEST"
          printf -- "- Release coordinate: \`%s:%s\` at \`%s\`\n" \
            "$IMAGE" "${TAG_NAME#v}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote Mutable Pointers
    needs: [publish, release]
    # `release` is skipped on the main path, which would otherwise skip this job with it.
    if: |
      always()
      && needs.publish.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    # Single writer for `edge` and `latest`. Unlike the release coordinate these pointers are meant
    # to move, so GitHub cancelling a pending promotion is harmless: the run that superseded it
    # publishes the newer target anyway, and the ordering checks below refuse to move a pointer
    # backwards when an older build finishes last.
    concurrency:
      group: ${{ github.workflow }}-pointers
      cancel-in-progress: false
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Check whether this revision still leads main
        id: tip
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIP=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$TIP" = "$GITHUB_SHA" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "Leaving edge alone: main has advanced from $GITHUB_SHA to $TIP" >&2
          fi

      - name: Check whether this release outranks every published one
        id: highest
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_TAGS=$(git tag --list 'v*')
          export RELEASE_TAGS
          node scripts/release-latest-pointer.mjs --image "$IMAGE" --tag "$TAG_NAME"

      - name: Log in to GHCR
        if: steps.tip.outputs.promote == 'true' || steps.highest.outputs.promote == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point edge at this build
        if: steps.tip.outputs.promote == 'true'
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          # Retagging by digest republishes the manifest that was just built rather than rebuilding
          # it, so `edge` and the commit coordinate always resolve to one image.
          docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
          printf -- "- Moved \`%s:edge\` to \`%s\`\n" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Point latest at this release
        if: steps.highest.outputs.promote == 'true'
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          printf -- "- Moved \`%s:latest\` to \`%s\`\n" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
