# Official business and data endpoints. Atlassian, Airtable, and Amplitude are enabled by the
# protected-resource identity compatibility for issue #814: discovery accepts the identity each
# provider's well-known metadata document encodes. Amplitude's authorization remains unverified until
# OpenTag supports its token-endpoint authentication methods (its server advertises
# `client_secret_post` and `none`, not `client_secret_basic`); see #814 for the follow-up.
# These presets still need end-to-end authorization and tool-call verification.

