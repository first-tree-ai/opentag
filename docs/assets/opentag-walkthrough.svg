  <text x="326" y="216" class="b6 t" font-size="13.5">#482 Signup button dead on mobile</text>
  <text x="326" y="236" class="m" font-size="10.5">opened · 2 linked · fix/signup-cta-mobile</text>

  <rect x="278" y="298" width="694" height="42" rx="11" fill="#FFFFFF" stroke="#E0E2D3"/>
  <rect x="292" y="310" width="86" height="18" rx="9" fill="#F1F2EC"/>
  <text x="335" y="323" class="m" font-size="10.5" text-anchor="middle">Hold fn to talk</text>
  <text x="392" y="324" class="m" font-size="12">Message Product Eng</text>
</g>

<!-- ══ scene 2 — shared knowledge ════════════════════════ -->
<g class="sc s2 f">
  <circle cx="290" cy="90" r="11" fill="#C9CCBB"/>
  <text x="288" y="94" class="b7" font-size="10" fill="#FDFCF6" text-anchor="middle">S</text>
  <text x="310" y="86" class="b6 t" font-size="11.5">Sam</text>
  <text x="345" y="86" class="m" font-size="10.5">9:41 AM</text>
  <rect x="310" y="94" width="356" height="30" rx="9" fill="#EFF0E9"/>
  <text x="326" y="113" font-size="12.5"><tspan class="b6 g">@OpenTag</tspan><tspan class="t"> I just joined — where is the project at?</tspan></text>

  <circle cx="290" cy="158" r="11" fill="#8FDD14"/>
  <text x="290" y="162" class="b7" font-size="10" fill="#16211B" text-anchor="middle">O</text>
  <text x="310" y="154" class="b6 t" font-size="11.5">OpenTag</text>
  <rect x="364" y="145" width="30" height="13" rx="4" fill="#E9EBDE"/>
  <text x="379" y="155" class="b7 m" font-size="8" text-anchor="middle">BOT</text>
  <text x="402" y="154" class="m" font-size="10.5">9:41 AM</text>

  <rect x="310" y="164" width="380" height="86" rx="11" fill="#FFFFFF" stroke="#E0E2D3"/>
  <circle cx="333" cy="187" r="7" fill="#8FDD14"/>
  <text x="348" y="191" class="m" font-size="10.5">Pieced together from 14 threads, 3 channels</text>
  <text x="326" y="216" class="b6 t" font-size="13.5">Launch is Monday, pricing page still open</text>
  <text x="326" y="236" class="m" font-size="10.5">Kept by OpenTag · in plain files on your own machine</text>

  <rect x="278" y="298" width="694" height="42" rx="11" fill="#FFFFFF" stroke="#E0E2D3"/>
  <rect x="292" y="310" width="86" height="18" rx="9" fill="#F1F2EC"/>
  <text x="335" y="323" class="m" font-size="10.5" text-anchor="middle">Hold fn to talk</text>
  <text x="392" y="324" class="m" font-size="12">Message Product Eng</text>
</g>

