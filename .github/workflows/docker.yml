name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  # Every run publishes an immutable commit-SHA image that deployments pin, so no run may be
  # cancelled by a later push. The group is keyed on the revision because GitHub also cancels a
  # pending run once a newer run queues into the same group, which would drop the image of a
  # commit that landed between two other pushes.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR Image
    if: github.repository == 'first-tree-ai/opentag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate production release coordinate
        if: github.ref_type == 'tag'
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REPOSITORY_VISIBILITY" != "public" ]; then
            echo "Production images require a public source repository" >&2
            exit 1
          fi
          SOURCE_VERSION=$(node -p "require('./apps/cli/package.json').version")
          node scripts/release-versions.mjs \
            --channel prod \
            --source-version "$SOURCE_VERSION" \
            --tag "$TAG_NAME"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Production tag must point to a commit in main history" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=server-image
          cache-to: ${{ github.ref_type == 'branch' && 'type=gha,mode=max,scope=server-image' || '' }}
