name: Alert Relay

on:
  pull_request:
    paths:
      - ops/alert-relay/**
      - .github/workflows/alert-relay.yml
  push:
    branches: [main]
    paths:
      - ops/alert-relay/**
      - .github/workflows/alert-relay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/alert-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: ops/alert-relay/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker build --tag opentag-alert-relay:test .
