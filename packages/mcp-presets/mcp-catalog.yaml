# The marketplace catalog.
#
# Each entry is a registry-style record for an MCP Server, validated against
# `schema/mcp-catalog-entry.schema.json` by `pnpm catalog:generate`. An entry lists `remotes` (hosted
# endpoints), `packages` (self-hosted packages), or both. Only an entry with a streamable-http remote
# is installable and shown as an addable card; packages are recorded as data and are not yet
# installable.
#
#   id                 `mcp/<slug>`; the slug is the Server definition name (MCPServerNameSchema:
#                      lowercase letters, digits, hyphens) and the card id
#   name               the card's name, in every supported locale
#   summary            the card's description, in every supported locale. Card copy only: the create
#                      contract has no description field
#   when_to_use        one sentence that tells an Agent when this Server is the right tool
#   keywords, aliases, tags
#                      optional search terms; Discover search matches them
#   capabilities       what the Server lets an Agent do, as kebab-case tokens
#   status             active | deprecated | archived | removed. Only `active` entries are listed in
#                      Discover; `removed` entries are not emitted at all
#   auth.methods       the authorization kinds the Server accepts: none, bearer, oauth
#   auth.default_kind  a prefill for a new authorization, NEVER a claim about what the Server requires.
#                      The catalog author confirms the method; the UI must state the method it will use
#                      without asserting the Server demands it.
#   auth.oauth         required when `oauth` is a method (the generator rejects it otherwise); write
#                      `oauth: {}` to leave scope selection to discovery
#   auth.oauth.scopes  optional; the OAuth scopes the provider's consent screen is configured for,
#                      requested when a card starts OAuth. At most 64 scopes of at most 255 characters
#                      each.
#   auth.bearer        optional key endpoint, auth_header, and auth_scheme (an empty prefix is valid).
#                      Requires bearer in auth.methods; contains no credential.
#   risk               side_effects (none | write | destructive) may not be weaker than any listed tool;
#                      data_access is public or private
#   remotes            hosted endpoints. The first streamable-http remote is the installable endpoint;
#                      its `headers` hold the auth header (role: auth) and any static extra headers
#                      (role: extra). An sse remote is data only
#   packages           self-hosted packages (registry_type, identifier, version, transport, ...),
#                      optionally with `prerequisites` and `platforms`; data only for now
#   catalog            category (declared in `mcp-categories.yaml`), order within it, icon (a file under
#                      `packages/mcp-presets/icons/`), and icon_is_official (true only for a verified
#                      official product mark; unverified assets use a generic UI icon)
#   homepage           the provider's site
#
# Entries carry no credential of any kind.

- schema_version: 1
  id: mcp/notion
  kind: mcp
  name:
    en: "Notion"
    zh: "Notion"
  summary:
    en: "Search and edit docs and wikis."
    zh: "搜索和编辑文档与知识库。"
  when_to_use:
    en: "Use when the task needs to find, read, or update pages and wikis in Notion."
    zh: "当任务需要查找、阅读或更新 Notion 中的页面和知识库时使用。"
  keywords: ["wiki", "notes", "knowledge base"]
  capabilities: ["search-docs", "read-pages", "edit-pages"]
  status: active
  auth:
    methods: [oauth]
    default_kind: oauth
    oauth: {}
  risk:
    side_effects: write
    data_access: private
  remotes:
    - type: streamable-http
      url: https://mcp.notion.com/mcp
  catalog:
    category: docs
    order: 10
    icon: notion.png
    icon_is_official: true
  homepage: https://www.notion.com

