# Official business and data endpoints; authenticated OpenTag compatibility is not yet verified.
# Airtable and Amplitude advertise origin-only OAuth resource identifiers. Atlassian's gateway
# endpoint below advertises a resource without the tools query. The current exact-resource check
# rejects these three OAuth discoveries; resolving that incompatibility is separate follow-up work.
# Supabase and Stripe also need end-to-end authorization and tool-call verification.

