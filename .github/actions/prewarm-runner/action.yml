name: Prewarm Runner image
description: Import the verified digest in the actual deployment region and remove the owned probe
inputs:
  release:
    description: Path to the verified Runner release record
    required: true
runs:
  using: composite
  steps:
    - name: Import Runner image and verify cleanup
      shell: bash
      env:
        RELEASE_RECORD: ${{ inputs.release }}
      run: >-
        node scripts/runner/prewarm.mjs run --release "$RELEASE_RECORD"
        --state "$RUNNER_TEMP/runner-prewarm-state.json"
        --output "$RUNNER_TEMP/runner-prewarm-result.json"

    # The ownership record precedes create. This second cleanup also covers interrupted runs.
    - name: Ensure the owned probe is removed
      if: always()
      shell: bash
      run: node scripts/runner/prewarm.mjs cleanup --state "$RUNNER_TEMP/runner-prewarm-state.json"

    - name: Preserve image preparation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: runner-prewarm-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/runner-prewarm-state.json
          ${{ runner.temp }}/runner-prewarm-result.json
        if-no-files-found: ignore
