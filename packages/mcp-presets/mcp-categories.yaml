# The marketplace category set.
#
# Every category declared here must be referenced by at least one entry in `mcp-catalog.yaml`, and
# every entry's `category` must name one of these ids — `pnpm check` fails either way.
# Discover shows category navigation only for categories with at least two entries. Entries from
# smaller categories remain available in All and search.
#
# `label` must supply every locale listed in `apps/web/project.inlang/settings.json`. A missing locale
# fails the build rather than falling back to another at render time.
# `order` sets the category navigation order.

- id: docs
  label:
    en: Docs & Knowledge
    zh: 文档与知识
  order: 10

- id: communication
  label:
    en: Communication
    zh: 沟通
  order: 20

- id: projects
  label:
    en: Projects
    zh: 项目管理
  order: 30

- id: development
  label:
    en: Developer Tools
    zh: 开发工具
  order: 40

- id: search
  label:
    en: Web Search
    zh: 网页搜索
  order: 50

- id: data
  label:
    en: Data & Analytics
    zh: 数据分析
  order: 60

- id: design
  label:
    en: Design
    zh: 设计
  order: 70

- id: sales
  label:
    en: Sales & CRM
    zh: 销售与客户
  order: 80

- id: finance
  label:
    en: Finance & Payments
    zh: 财务支付
