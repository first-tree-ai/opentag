name: Patch Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Determine Coverage Scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.diff.outputs.required }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Inspect changed paths
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/patch-coverage-plan.mjs

  measure:
    name: Measure Coverage (${{ matrix.project }})
    needs: plan
    if: needs.plan.outputs.required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [cli, web, shared, skill-presets, mcp-presets, client, server]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Verify toolchain
        run: pnpm toolchain:check

      - name: Build test dependencies
        run: pnpm build

      - name: Measure workspace coverage
        env:
          COVERAGE_PROJECT: ${{ matrix.project }}
        run: node scripts/unit-coverage.mjs --project "$COVERAGE_PROJECT"

      - name: Upload workspace reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-coverage-${{ matrix.project }}
          path: coverage/unit/${{ matrix.project }}/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  patch:
    name: Enforce Patch Coverage
    needs: [plan, measure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify coverage prerequisites
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          COVERAGE_REQUIRED: ${{ needs.plan.outputs.required }}
          MEASUREMENT_RESULT: ${{ needs.measure.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$COVERAGE_REQUIRED" in
            true) test "$MEASUREMENT_RESULT" = success ;;
            false) test "$MEASUREMENT_RESULT" = skipped ;;
            *) echo "Missing coverage scope decision" >&2; exit 1 ;;
          esac

      - name: Explicit pass for changes outside coverage scope
        if: needs.plan.outputs.required == 'false'
        run: echo "Patch coverage passed; no coverable source files changed. Measurement was not needed."

      - name: Check out repository
        if: needs.plan.outputs.required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        if: needs.plan.outputs.required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download workspace reports
        if: needs.plan.outputs.required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: patch-coverage-*
          path: coverage/unit

      - name: Aggregate coverage and enforce floors
        if: needs.plan.outputs.required == 'true'
        run: node scripts/coverage-artifacts.mjs

      - name: Summarize coverage provenance
        if: needs.plan.outputs.required == 'true'
        run: |
          {
            echo "### Coverage provenance"
            echo
            echo 'Fresh per-workspace measurements from this workflow run; reports are concatenated without merging overlapping files.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize test duration and retry diagnostics
        if: always() && needs.plan.outputs.required == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (!summaryPath) process.exit(0);
          const reportPath = "coverage/unit/coverage-run.json";
          if (!existsSync(reportPath)) {
            appendFileSync(summaryPath, "\n### Unit test duration and retry diagnostics\n\nCoverage run metadata was not produced.\n");
            process.exit(0);
          }
          const report = JSON.parse(readFileSync(reportPath, "utf8"));
          const packages = Array.isArray(report.packages) ? report.packages : [];
          const rows = packages
            .sort((left, right) => String(left.name).localeCompare(String(right.name)))
            .map(
              (entry) =>
                `| ${entry.name} | ${Number(entry.durationMs ?? 0).toFixed(0)} ms | ${entry.testCount ?? 0} | ` +
                `${entry.retryCount ?? 0} | ${entry.flakyCount ?? 0} | ${entry.failedAfterRetryCount ?? 0} |`,
            )
            .join("\n");
          const retries = packages.reduce((total, entry) => total + (Number(entry.retryCount) || 0), 0);
          const flaky = packages.reduce((total, entry) => total + (Number(entry.flakyCount) || 0), 0);
          appendFileSync(
            summaryPath,
            `\n### Unit test duration and retry diagnostics\n\n` +
              `Retries are diagnostic: a retried-then-passed test is reported as flaky and is never silently green. ` +
              `Observed retries: **${retries}**; retried-then-passed tests: **${flaky}**.\n\n` +
              `| Package | Duration | Tests | Retries | Flaky | Failed after retry |\n| --- | ---: | ---: | ---: | ---: | ---: |\n` +
              (rows || "| (none) | 0 ms | 0 | 0 | 0 | 0 |") +
              "\n",
          );
          NODE

      - name: Enforce changed-line coverage
        if: needs.plan.outputs.required == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PATCH_COVERAGE_THRESHOLD: "80"
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { captureMergeBaseDiff } from "./scripts/patch-diff.mjs";
          import { evaluatePatchCoverage } from "./scripts/unit-coverage-gate.mjs";

          const repositoryRoot = process.cwd();
          const baseSha = process.env.BASE_SHA;
          const threshold = Number(process.env.PATCH_COVERAGE_THRESHOLD);
          if (!baseSha || !Number.isFinite(threshold)) {
            throw new Error("BASE_SHA and PATCH_COVERAGE_THRESHOLD are required");
          }

          // Stream the patch to a private temporary file to avoid the spawn buffer limit.
          // Git errors fail closed inside the helper, and the temporary file is cleaned up.
          const diff = captureMergeBaseDiff({ baseSha, repositoryRoot });

          const coverage = JSON.parse(readFileSync(`${repositoryRoot}/coverage/unit/coverage-final.json`, "utf8"));
          const result = evaluatePatchCoverage({ coverage, diff, repositoryRoot, threshold });
          if (result.total === 0) {
            console.log("Patch coverage: no executable changed lines were found (explicit pass).");
            process.exit(0);
          }
          console.log(
            `Patch coverage: ${result.covered}/${result.total} lines (${result.percent.toFixed(2)}%), threshold ${threshold.toFixed(2)}%.`,
          );
          if (result.uncovered.length > 0) console.log(`Uncovered changed lines:\n${result.uncovered.join("\n")}`);
          if (!result.passed) process.exit(1);
          NODE
