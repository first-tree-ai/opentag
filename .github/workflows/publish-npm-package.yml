name: npm Publish

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  staging:
    name: Publish CLI Staging
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the successful main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify staging revision is current main
        run: node scripts/check-staging-revision.mjs

      - name: Use trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Check source formatting and lint rules
        run: pnpm check

      - name: Build source workspaces
        run: pnpm build

      - name: Type-check source workspaces
        run: pnpm typecheck

      - name: Resolve release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve staging version
        id: version
        run: |
          SOURCE_VERSION=$(node -p "require('./apps/cli/package.json').version")
          node scripts/resolve-staging-release.mjs \
            --source-version "$SOURCE_VERSION" \
            --git-head "${{ steps.revision.outputs.sha }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Check npm coordinate
        id: registry
        run: >-
          node scripts/check-npm-version.mjs
          --package "${{ steps.version.outputs.package_name }}"
          --version "${{ steps.version.outputs.version }}"
          --git-head "${{ steps.revision.outputs.sha }}"

      - name: Prepare staging package identity
        run: >-
          node scripts/prepare-cli-release.mjs
          --channel staging
          --version "${{ steps.version.outputs.version }}"

      - name: Build staging CLI
        run: pnpm --dir apps/cli build

      - name: Type-check staging CLI
        run: pnpm --dir apps/cli typecheck

      - name: Smoke staging tarball
        run: >-
          node scripts/cli-pack-smoke.mjs
          --channel staging
          --name "${{ steps.version.outputs.package_name }}"
          --version "${{ steps.version.outputs.version }}"
          --binary "${{ steps.version.outputs.binary_name }}"

      # The portable release is preflighted before npm publishing so an immutable Cloud Storage
      # conflict fails the run while npm is still unpublished and the release can be retried.
      - name: Authenticate to Google Cloud
        if: vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.OPENTAG_PORTABLE_GCP_SERVICE_ACCOUNT }}

      - name: Set up the Cloud Storage CLI
        if: vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Preflight portable staging release
        if: vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        env:
          OPENTAG_PORTABLE_DOWNLOAD_BASE_URL: ${{ vars.OPENTAG_PORTABLE_DOWNLOAD_BASE_URL }}
          OPENTAG_PORTABLE_GCS_BUCKET: ${{ vars.OPENTAG_PORTABLE_GCS_BUCKET }}
          OPENTAG_PORTABLE_GCS_PREFIX: ${{ vars.OPENTAG_PORTABLE_GCS_PREFIX }}
          OPENTAG_PORTABLE_GCS_PROJECT: ${{ vars.OPENTAG_PORTABLE_GCS_PROJECT }}
          OPENTAG_PORTABLE_PLATFORMS: ${{ vars.OPENTAG_PORTABLE_PLATFORMS }}
        run: >-
          ./scripts/portable/release-gcs.sh
          --channel staging
          --version "${{ steps.version.outputs.version }}"
          --skip-workspace-build
          --preflight-only

      - name: Recheck staging revision is current main
        run: node scripts/check-staging-revision.mjs

      - name: Publish staging package
        if: steps.registry.outputs.publish == 'true'
        working-directory: apps/cli
        run: npm publish --tag latest --access public

      # Reuses the preflighted artifacts so the published bytes are the ones that were checked.
      - name: Publish portable staging release
        if: vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        env:
          OPENTAG_PORTABLE_DOWNLOAD_BASE_URL: ${{ vars.OPENTAG_PORTABLE_DOWNLOAD_BASE_URL }}
          OPENTAG_PORTABLE_GCS_BUCKET: ${{ vars.OPENTAG_PORTABLE_GCS_BUCKET }}
          OPENTAG_PORTABLE_GCS_PREFIX: ${{ vars.OPENTAG_PORTABLE_GCS_PREFIX }}
          OPENTAG_PORTABLE_GCS_PROJECT: ${{ vars.OPENTAG_PORTABLE_GCS_PROJECT }}
        run: >-
          ./scripts/portable/release-gcs.sh
          --channel staging
          --version "${{ steps.version.outputs.version }}"
          --skip-build

  production:
    name: Publish CLI Production
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Production releases publish a mutable channel pointer, so they must be single-writer. Queued
    # rather than cancelled: a cancelled run could stop between the two channel objects.
    concurrency:
      group: npm-publish-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Check source formatting and lint rules
        run: pnpm check

      - name: Build source workspaces
        run: pnpm build

      - name: Type-check source workspaces
        run: pnpm typecheck

      - name: Validate production source and tag
        id: version
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REPOSITORY_VISIBILITY" != "public" ]; then
            echo "Production npm publishing requires a public source repository" >&2
            exit 1
          fi
          if [ "$(node -p "require('./apps/cli/package.json').name")" != "open-tag" ]; then
            echo "Unexpected source package identity" >&2
            exit 1
          fi
          SOURCE_VERSION=$(node -p "require('./apps/cli/package.json').version")
          node scripts/release-versions.mjs \
            --channel prod \
            --source-version "$SOURCE_VERSION" \
            --tag "$TAG_NAME"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Production tag must point to a commit in main history" >&2
            exit 1
          fi

      - name: Resolve release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check npm coordinate
        id: registry
        run: >-
          node scripts/check-npm-version.mjs
          --package "${{ steps.version.outputs.package_name }}"
          --version "${{ steps.version.outputs.version }}"
          --git-head "${{ steps.revision.outputs.sha }}"

      - name: Prepare production package identity
        run: >-
          node scripts/prepare-cli-release.mjs
          --channel prod
          --version "${{ steps.version.outputs.version }}"

      - name: Build production CLI
        run: pnpm --dir apps/cli build

      - name: Type-check production CLI
        run: pnpm --dir apps/cli typecheck

      - name: Smoke production tarball
        run: >-
          node scripts/cli-pack-smoke.mjs
          --channel prod
          --name "${{ steps.version.outputs.package_name }}"
          --version "${{ steps.version.outputs.version }}"
          --binary "${{ steps.version.outputs.binary_name }}"

      # The portable release is preflighted before npm publishing so an immutable Cloud Storage
      # conflict fails the run while npm is still unpublished and the release can be retried.
      - name: Authenticate to Google Cloud
        if: vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.OPENTAG_PORTABLE_GCP_SERVICE_ACCOUNT }}

      - name: Set up the Cloud Storage CLI
        if: vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Preflight portable production release
        if: vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        env:
          OPENTAG_PORTABLE_DOWNLOAD_BASE_URL: ${{ vars.OPENTAG_PORTABLE_DOWNLOAD_BASE_URL }}
          OPENTAG_PORTABLE_GCS_BUCKET: ${{ vars.OPENTAG_PORTABLE_GCS_BUCKET }}
          OPENTAG_PORTABLE_GCS_PREFIX: ${{ vars.OPENTAG_PORTABLE_GCS_PREFIX }}
          OPENTAG_PORTABLE_GCS_PROJECT: ${{ vars.OPENTAG_PORTABLE_GCS_PROJECT }}
          OPENTAG_PORTABLE_PLATFORMS: ${{ vars.OPENTAG_PORTABLE_PLATFORMS }}
        run: >-
          ./scripts/portable/release-gcs.sh
          --channel prod
          --version "${{ steps.version.outputs.version }}"
          --skip-workspace-build
          --preflight-only

      - name: Publish production package
        if: steps.registry.outputs.publish == 'true'
        working-directory: apps/cli
        run: npm publish --tag latest --access public --provenance

      # Reuses the preflighted artifacts so the published bytes are the ones that were checked.
      - name: Publish portable production release
        if: vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        env:
          OPENTAG_PORTABLE_DOWNLOAD_BASE_URL: ${{ vars.OPENTAG_PORTABLE_DOWNLOAD_BASE_URL }}
          OPENTAG_PORTABLE_GCS_BUCKET: ${{ vars.OPENTAG_PORTABLE_GCS_BUCKET }}
          OPENTAG_PORTABLE_GCS_PREFIX: ${{ vars.OPENTAG_PORTABLE_GCS_PREFIX }}
          OPENTAG_PORTABLE_GCS_PROJECT: ${{ vars.OPENTAG_PORTABLE_GCS_PROJECT }}
        run: >-
          ./scripts/portable/release-gcs.sh
          --channel prod
          --version "${{ steps.version.outputs.version }}"
          --skip-build
