<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="OpenTag in four steps: bring your own subscription, an AI worker in your team chat, shared knowledge kept on your own machine, and connecting the rest of your stack.">
<title>OpenTag in four steps</title>
<style>
  .f { font-family: "DM Sans", "Helvetica Neue", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .t  { fill:#16211B }
  .m  { fill:#626B60 }
  .g  { fill:#3A5C04 }
  .b6 { font-weight:600 }
  .b7 { font-weight:700 }
  .lbl{ font-size:10px; letter-spacing:.09em; font-weight:600; fill:#626B60 }

  .sc, .ra, .rbar { opacity:0 }
  .s0 { animation: k0 24s linear infinite }
  .s1 { animation: k1 24s linear infinite }
  .s2 { animation: k2 24s linear infinite }
  .s3 { animation: k3 24s linear infinite }
  @keyframes k0 { 0%{opacity:0} 1.5%{opacity:1} 23.5%{opacity:1} 25%{opacity:0} 100%{opacity:0} }
  @keyframes k1 { 0%,25%{opacity:0} 26.5%{opacity:1} 48.5%{opacity:1} 50%{opacity:0} 100%{opacity:0} }
  @keyframes k2 { 0%,50%{opacity:0} 51.5%{opacity:1} 73.5%{opacity:1} 75%{opacity:0} 100%{opacity:0} }
  @keyframes k3 { 0%,75%{opacity:0} 76.5%{opacity:1} 98.5%{opacity:1} 100%{opacity:0} }

  .bar { transform-box: fill-box; transform-origin: top center; }
  .p0 { animation: g0 24s linear infinite }
  .p1 { animation: g1 24s linear infinite }
  .p2 { animation: g2 24s linear infinite }
  .p3 { animation: g3 24s linear infinite }
  @keyframes g0 { 0%{opacity:1;transform:scaleY(0)} 25%{opacity:1;transform:scaleY(1)} 25.01%{opacity:0} 100%{opacity:0;transform:scaleY(1)} }
  @keyframes g1 { 0%,25%{opacity:0;transform:scaleY(0)} 25.01%{opacity:1} 50%{opacity:1;transform:scaleY(1)} 50.01%{opacity:0} 100%{opacity:0} }
  @keyframes g2 { 0%,50%{opacity:0;transform:scaleY(0)} 50.01%{opacity:1} 75%{opacity:1;transform:scaleY(1)} 75.01%{opacity:0} 100%{opacity:0} }
  @keyframes g3 { 0%,75%{opacity:0;transform:scaleY(0)} 75.01%{opacity:1} 100%{opacity:1;transform:scaleY(1)} }

  @media (prefers-reduced-motion: reduce) {
    .sc, .ra, .rbar, .bar { animation: none !important }
    .s0, .p0 { opacity:1 }
    .s1, .s2, .s3, .p1, .p2, .p3 { opacity:0 }
  }
</style>

<rect x=".5" y=".5" width="999" height="379" rx="14" fill="#FDFCF6" stroke="#E0E2D3"/>
<path d="M250 1V379" stroke="#E0E2D3"/>
<rect x="1" y="1" width="249" height="378" fill="#F8F7F0"/>
<path d="M250 1h749a14 14 0 0 1 14 14v37H250z" fill="#FDFCF6"/>
<path d="M250 52H1000" stroke="#E0E2D3"/>

<!-- ── rail ─────────────────────────────────────────────── -->
<g class="f">
  <!-- 01 -->
  <rect class="bar p0" x="1" y="26" width="3" height="74" fill="#8FDD14"/>
  <rect x="20" y="42" width="26" height="18" rx="5" fill="#E9EBDE"/>
  <rect class="sc s0" x="20" y="42" width="26" height="18" rx="5" fill="#8FDD14"/>
  <text x="33" y="55" class="b7 t" font-size="10.5" text-anchor="middle">01</text>
  <text x="56" y="55" class="b6 t" font-size="13">Your subscription</text>
  <text x="56" y="73" class="m" font-size="11">One minute to set up.</text>

  <!-- 02 -->
  <rect class="bar p1" x="1" y="108" width="3" height="74" fill="#8FDD14"/>
  <rect x="20" y="124" width="26" height="18" rx="5" fill="#E9EBDE"/>
  <rect class="sc s1" x="20" y="124" width="26" height="18" rx="5" fill="#8FDD14"/>
  <text x="33" y="137" class="b7 t" font-size="10.5" text-anchor="middle">02</text>
  <text x="56" y="137" class="b6 t" font-size="13">AI worker in your chat</text>
  <text x="56" y="155" class="m" font-size="11">Delegate your work to</text>
  <text x="56" y="169" class="m" font-size="11">OpenTag.</text>

  <!-- 03 -->
  <rect class="bar p2" x="1" y="190" width="3" height="74" fill="#8FDD14"/>
  <rect x="20" y="206" width="26" height="18" rx="5" fill="#E9EBDE"/>
  <rect class="sc s2" x="20" y="206" width="26" height="18" rx="5" fill="#8FDD14"/>
  <text x="33" y="219" class="b7 t" font-size="10.5" text-anchor="middle">03</text>
  <text x="56" y="219" class="b6 t" font-size="13">Shared knowledge</text>
  <text x="56" y="237" class="m" font-size="11">Context from every</text>
  <text x="56" y="251" class="m" font-size="11">channel, kept by OpenTag.</text>

  <!-- 04 -->
  <rect class="bar p3" x="1" y="272" width="3" height="74" fill="#8FDD14"/>
  <rect x="20" y="288" width="26" height="18" rx="5" fill="#E9EBDE"/>
  <rect class="sc s3" x="20" y="288" width="26" height="18" rx="5" fill="#8FDD14"/>
  <text x="33" y="301" class="b7 t" font-size="10.5" text-anchor="middle">04</text>
  <text x="56" y="301" class="b6 t" font-size="13">Connect your stack</text>
  <text x="56" y="319" class="m" font-size="11">Reach the rest of your</text>
  <text x="56" y="333" class="m" font-size="11">tools with the same tag.</text>
</g>

<!-- ── window chrome ────────────────────────────────────── -->
<g>
  <circle cx="276" cy="26" r="5" fill="#F26D5B"/>
  <circle cx="292" cy="26" r="5" fill="#F5BE4F"/>
  <circle cx="308" cy="26" r="5" fill="#66C267"/>
</g>
<g class="f m" font-size="11.5">
  <text class="sc s0" x="330" y="30">OpenTag <tspan class="m">›</tspan> Setup</text>
  <text class="sc s1" x="330" y="30">Product Eng <tspan class="m">·</tspan> 11 members</text>
  <text class="sc s2" x="330" y="30">Product Eng <tspan class="m">·</tspan> 11 members</text>
  <text class="sc s3" x="330" y="30">OpenTag <tspan class="m">›</tspan> Connections</text>
</g>

<!-- ══ scene 0 — bring your own subscription ═════════════ -->
<g class="sc s0 f">
  <text x="278" y="86" class="lbl">CONNECT YOUR WORKSPACE</text>
  <g>
    <rect x="278" y="96" width="337" height="62" rx="10" fill="#FBFEF5" stroke="#8FDD14" stroke-width="1.6"/>
    <rect x="296" y="112" width="26" height="26" rx="7" fill="#00D6B9"/>
    <text x="309" y="130" class="b7" font-size="12" fill="#FFFFFF" text-anchor="middle">L</text>
    <text x="334" y="130" class="b6 t" font-size="13.5">Feishu / Lark</text>
    <circle cx="591" cy="127" r="7" fill="none" stroke="#8FDD14" stroke-width="1.6"/>
    <circle cx="591" cy="127" r="3.4" fill="#8FDD14"/>
  </g>
  <g>
    <rect x="635" y="96" width="337" height="62" rx="10" fill="#FFFFFF" stroke="#E0E2D3"/>
    <rect x="653" y="112" width="26" height="26" rx="7" fill="#4A154B"/>
    <text x="666" y="130" class="b7" font-size="12" fill="#FFFFFF" text-anchor="middle">S</text>
    <text x="691" y="130" class="b6 t" font-size="13.5">Slack</text>
    <circle cx="948" cy="127" r="7" fill="none" stroke="#C9CCBB" stroke-width="1.6"/>
  </g>

  <text x="278" y="194" class="lbl">CHOOSE YOUR MODEL</text>
  <g>
    <rect x="278" y="204" width="218" height="62" rx="10" fill="#FBFEF5" stroke="#8FDD14" stroke-width="1.6"/>
    <rect x="296" y="220" width="26" height="26" rx="7" fill="#D97757"/>
    <text x="309" y="238" class="b7" font-size="12" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="334" y="238" class="b6 t" font-size="13">Claude Code</text>
    <circle cx="472" cy="235" r="7" fill="none" stroke="#8FDD14" stroke-width="1.6"/>
    <circle cx="472" cy="235" r="3.4" fill="#8FDD14"/>
  </g>
  <g>
    <rect x="516" y="204" width="218" height="62" rx="10" fill="#FFFFFF" stroke="#E0E2D3"/>
    <rect x="534" y="220" width="26" height="26" rx="7" fill="#16211B"/>
    <text x="547" y="238" class="b7" font-size="12" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="572" y="238" class="b6 t" font-size="13">Codex</text>
    <circle cx="710" cy="235" r="7" fill="none" stroke="#C9CCBB" stroke-width="1.6"/>
  </g>
  <g>
    <rect x="754" y="204" width="218" height="62" rx="10" fill="#FFFFFF" stroke="#E0E2D3" stroke-dasharray="4 3"/>
    <text x="785" y="240" class="m" font-size="19" text-anchor="middle">+</text>
    <text x="810" y="238" class="b6 m" font-size="13">Any agent CLI</text>
  </g>

  <text x="278" y="308" class="t" font-size="12.5">Runs on the plan you already pay for. OpenTag ships no model and holds no key —</text>
  <text x="278" y="328" class="t" font-size="12.5">the agent authenticates the way it already does on your machine.</text>
</g>

<!-- ══ scene 1 — an AI worker in your chat ═══════════════ -->
<g class="sc s1 f">
  <circle cx="290" cy="90" r="11" fill="#C9CCBB"/>
