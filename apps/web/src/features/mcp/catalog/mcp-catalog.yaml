# The marketplace catalog.
#
# Each entry prefills a Server definition for a remote Streamable HTTP MCP endpoint. Only remote HTTP
# Servers may be listed: OpenTag is a hosted service and cannot run a user's local stdio subprocess.
#
#   name             the definition name; must satisfy MCPServerNameSchema (lowercase letters, digits,
#                    hyphens) so a card's human-readable name lives in `title` instead
#   title            the card's name, in every supported locale
#   description      the card's description, in every supported locale. Card copy only: the create
#                    contract has no description field, so the definition starts without one and the
#                    Agent page shows the Server's own description once a probe succeeds
#   defaultAuthKind  a prefill for a new authorization, NEVER a claim about what the Server requires.
#                    The catalog author confirms the method; the UI must state the method it will use
#                    without asserting the Server demands it.
#   category         an id declared in `mcp-categories.yaml`
#   website          the provider's site, linked from the card
#   icon             a file under `apps/web/src/assets/mcp/`
#   order            position within the category
#
# Entries carry no credential of any kind.

- id: notion
  name: notion
  title:
    en: Notion
    zh: Notion
  description:
    en: Docs, wikis, and project pages.
    zh: 文档、知识库与项目页面。
  url: https://mcp.notion.com/mcp
  defaultAuthKind: oauth
  category: general
  website: https://www.notion.com
  icon: notion.svg
  order: 10

