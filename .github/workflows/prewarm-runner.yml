name: Prewarm Runner

on:
  # Runs on default main after a protected tag's entire release succeeds. The production
  # Environment allows main, not tag jobs; its existing reviewer gate remains authoritative.
  workflow_run:
    workflows:
      - npm Publish
    types:
      - completed
  workflow_dispatch:
    inputs:
      channel:
        description: Environment whose image import should be prepared (no Server deployment)
        required: true
        type: choice
        options: [staging, prod]
      version:
        description: Exact published Runner/CLI version
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  # Preparation owns no live target. Keep every release, without displacing a queued deploy.
  group: runner-prewarm-${{ inputs.channel == 'staging' && 'staging' || 'prod' }}
  queue: max

jobs:
  prewarm:
    if: >-
      github.repository == 'first-tree-ai/opentag' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.channel == 'staging' && 'staging' || 'production' }}
    env:
      RELEASE_CHANNEL: ${{ inputs.channel || 'prod' }}
      RELEASE_VERSION: ${{ inputs.version }}
      RUNNER_IMAGE: ${{ vars[format('OPENTAG_RUNNER_{0}_IMAGE_REPOSITORY', inputs.channel == 'staging' && 'STAGING' || 'PROD')] }}
      CAPROVER_SERVER: ${{ secrets[format('CAPROVER_{0}_SERVER', inputs.channel == 'staging' && 'STAGING' || 'PROD')] }}
      CAPROVER_APP: ${{ secrets[format('CAPROVER_{0}_APP', inputs.channel == 'staging' && 'STAGING' || 'PROD')] }}
      CAPROVER_PASSWORD_SECRET: ${{ vars[format('CAPROVER_{0}_PASSWORD_SECRET', inputs.channel == 'staging' && 'STAGING' || 'PROD')] }}
      OPENTAG_PUBLIC_URL: ${{ inputs.channel == 'staging' && 'https://dev.opentag.build' || 'https://app.opentag.build' }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Authenticate deployment identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.OPENTAG_PORTABLE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.OPENTAG_PORTABLE_GCS_PROJECT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Read and verify the completed production release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name runner-release-prod --dir "$RUNNER_TEMP/runner-release"
          node scripts/runner/release.mjs resolve --channel prod --image "$RUNNER_IMAGE" \
            --source-sha "$RELEASE_SHA" --metadata "$RUNNER_TEMP/runner-release/runner-release.json" \
            --output "$RUNNER_TEMP/runner-target.json"

      - name: Verify the requested published release
        if: github.event_name == 'workflow_dispatch'
        run: >-
          node scripts/runner/release.mjs resolve --channel "$RELEASE_CHANNEL" --image "$RUNNER_IMAGE"
          --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/runner-target.json"

      - name: Verify reviewed source ancestry
        run: |
          SOURCE_SHA=$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/runner-target.json', 'utf8')).sourceSha")
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Prewarm the verified Runner image
        uses: ./.github/actions/prewarm-runner
        with:
          release: ${{ runner.temp }}/runner-target.json
