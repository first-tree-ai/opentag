  </g>
  <g>
    <rect x="278" y="188" width="337" height="40" rx="9" fill="#FFFFFF" stroke="#E0E2D3"/>
    <rect x="292" y="197" width="22" height="22" rx="6" fill="#2F2F2F"/>
    <text x="303" y="212" class="b7" font-size="9.5" fill="#FFFFFF" text-anchor="middle">NO</text>
