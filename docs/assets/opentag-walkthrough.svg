  </g>
  <g>
    <rect x="635" y="236" width="337" height="40" rx="9" fill="#FFFFFF" stroke="#E0E2D3"/>
    <rect x="649" y="245" width="22" height="22" rx="6" fill="#5E6AD2"/>
    <text x="660" y="260" class="b7" font-size="9.5" fill="#FFFFFF" text-anchor="middle">LI</text>
    <text x="681" y="261" class="b6 t" font-size="12.5">Linear</text>
    <circle cx="950" cy="256" r="7" fill="none" stroke="#C9CCBB" stroke-width="1.5"/>
  </g>

  <text x="278" y="316" class="m" font-size="11.5">Today the agent reaches these the way you do — through the CLIs and credentials</text>
  <text x="278" y="334" class="m" font-size="11.5">already on that machine. A first-class connector catalog is next.</text>
