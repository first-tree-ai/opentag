services:
  postgres:
    image: postgres:17
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: opentag
      POSTGRES_USER: opentag
      POSTGRES_PASSWORD: opentag
    ports:
      - "${OPENTAG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - opentag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP: the image's temporary initialization server listens on the Unix socket only,
      # so a socket probe reports ready before the real server exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U opentag -d opentag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Local S3-compatible storage for Agent Skill bundles. The access key and secret below match the
  # OPENTAG_SKILL_STORAGE_* block in `.env.example`; they are development-only values.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address :9001
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: opentag
      MINIO_ROOT_PASSWORD: opentag-minio-dev
    ports:
      - "${OPENTAG_MINIO_PORT:-9000}:9000"
      - "${OPENTAG_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - opentag-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot bucket creation. `mc mb` is idempotent, so re-running the stack never fails here.
  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-07-38Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 opentag opentag-minio-dev &&
        mc mb --ignore-existing local/opentag-skills

volumes:
  opentag-postgres-data:
  opentag-minio-data:
