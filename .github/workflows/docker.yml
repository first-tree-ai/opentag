name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  # Keyed on the revision so no run is cancelled by a later push: GitHub also drops a pending run
  # once a newer one queues into the same group, which would lose the image of a commit that landed
  # between two others. Runs therefore overlap, and every coordinate below is written by exactly one
  # job that tolerates that overlap.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Commit Image
    # The branch path is the sole writer of the commit coordinate. Letting the tag path build too
    # would put two writers on one supposedly immutable coordinate whenever a tag is pushed while
    # the branch build for the same commit is still running: both would find it absent, and both
    # would publish a differently attested digest under it.
    if: github.repository == 'first-tree-ai/opentag' && github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.commit.outputs.present == 'true' && steps.commit.outputs.digest || steps.build.outputs.digest }}
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Look up the commit coordinate
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/registry-coordinate.mjs --image "$IMAGE" --reference "$GITHUB_SHA"

      - name: Set up Docker Buildx
        if: steps.commit.outputs.present != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.commit.outputs.present != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        if: steps.commit.outputs.present != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # This is the only build in the workflow. Every other coordinate retags the digest it
          # produces, so a release image is the same bytes CI already exercised on main.
          flavor: latest=false
          tags: type=raw,value=${{ github.sha }}

      - name: Build and publish image
        id: build
        if: steps.commit.outputs.present != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

      - name: Summarise the commit image
        env:
          REUSED: ${{ steps.commit.outputs.present }}
          DIGEST: ${{ steps.commit.outputs.present == 'true' && steps.commit.outputs.digest || steps.build.outputs.digest }}
        run: |
          # Tags are pointers; the digest is the only byte-for-byte pin.
          {
            echo "### Commit image"
            echo
            printf -- "- Digest: \`%s@%s\`\n" "$IMAGE" "$DIGEST"
            printf -- "- Commit coordinate: \`%s:%s\`\n" "$IMAGE" "$GITHUB_SHA"
            if [ "$REUSED" = "true" ]; then
              echo "- Reused the image already published for this revision; nothing was rebuilt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish Release Coordinate
    # Deliberately not on a shared concurrency group. A release coordinate is immutable and must
    # never be dropped, and GitHub cancels a pending run when another queues into its group.
    if: github.repository == 'first-tree-ai/opentag' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate production release coordinate
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REPOSITORY_VISIBILITY" != "public" ]; then
            echo "Production images require a public source repository" >&2
            exit 1
          fi
          SOURCE_VERSION=$(node -p "require('./apps/cli/package.json').version")
          node scripts/release-versions.mjs \
            --channel prod \
            --source-version "$SOURCE_VERSION" \
            --tag "$TAG_NAME"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Production tag must point to a commit in main history" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Reject an already published release coordinate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/registry-coordinate.mjs --image "$IMAGE" --reference "${TAG_NAME#v}" --require-absent

      - name: Wait for the commit image
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tagging a freshly merged commit is normal, so wait for the branch build to publish rather
          # than building a competing image here.
          node scripts/registry-coordinate.mjs --image "$IMAGE" --reference "$GITHUB_SHA" --wait

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release coordinate
        env:
          DIGEST: ${{ steps.commit.outputs.digest }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:${TAG_NAME#v}" "$IMAGE@$DIGEST"
          printf -- "- Release coordinate: \`%s:%s\` at \`%s\`\n" \
            "$IMAGE" "${TAG_NAME#v}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  reconcile-edge:
    name: Reconcile Edge
    needs: build
    if: github.repository == 'first-tree-ai/opentag' && github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    # `edge` has its own writer. Sharing a group with the release pointer would let a branch run
    # cancel a pending release-pointer run, which would then never move its own pointer.
    concurrency:
      group: ${{ github.workflow }}-edge
      cancel-in-progress: false
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve the newest published main commit
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reconciled rather than self-decided, for the same reason as `latest`: builds for
          # consecutive commits overlap, pointer runs can be dropped from the queue, and a run that
          # only asked "am I the tip?" would skip and strand `edge` whenever the tip's build failed.
          MAIN_COMMITS=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&per_page=30" --jq '.[].sha')
          export MAIN_COMMITS
          node scripts/edge-pointer.mjs --image "$IMAGE"

      - name: Log in to GHCR
        if: steps.target.outputs.move == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point edge at the newest published main commit
        if: steps.target.outputs.move == 'true'
        env:
          DIGEST: ${{ steps.target.outputs.digest }}
          COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
          printf -- "- Moved \`%s:edge\` to \`%s\` (%s)\n" \
            "$IMAGE" "$DIGEST" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"

  pull-request-build:
    name: Build Pull Request Image
    if: github.repository == 'first-tree-ai/opentag' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build pull request image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=server-image-pr
          cache-to: type=gha,mode=max,scope=server-image-pr

  reconcile-latest:
    name: Reconcile Latest
    needs: release
    if: github.repository == 'first-tree-ai/opentag' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-latest
      cancel-in-progress: false
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve the highest published release
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This reconciles rather than asking whether this run may promote itself. A pointer run can
          # be dropped from the queue, and a self-deciding run would then skip and strand `latest`
          # on an older release. Every run computes the same target, so whichever survives is right.
          RELEASE_TAGS=$(git tag --list 'v*')
          export RELEASE_TAGS
          node scripts/release-latest-pointer.mjs --image "$IMAGE"

      - name: Log in to GHCR
        if: steps.target.outputs.move == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at the highest published release
        if: steps.target.outputs.move == 'true'
        env:
          DIGEST: ${{ steps.target.outputs.digest }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          printf -- "- Moved \`%s:latest\` to \`%s\` (%s)\n" \
            "$IMAGE" "$DIGEST" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
