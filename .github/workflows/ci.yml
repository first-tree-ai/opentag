name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: "24"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branch name
        if: github.event_name == 'pull_request'
        env:
          ACTOR: ${{ github.actor }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          case "$BRANCH_NAME" in
            feat/*|fix/*|refactor/*|test/*|docs/*|chore/*|merge/*) ;;
            dependabot/npm_and_yarn/*|dependabot/github_actions/*)
              if [ "$ACTOR" != "dependabot[bot]" ]; then
                echo "Dependabot branch prefix is reserved for dependabot[bot]" >&2
                exit 1
              fi
              ;;
            *) echo "Invalid branch name: $BRANCH_NAME" >&2; exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Check formatting and lint rules
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test PostgreSQL integration
        run: pnpm --filter @opentag/server test:integration

  node-compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.13.0"
            name: Node 22.13.0 Compatibility
          - node: "26"
            name: Node 26 Compatibility
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Run compatibility smokes
        run: pnpm check:node-compat

  cli-pack-smoke:
    name: CLI Pack Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Build source CLI and dependencies
        run: pnpm exec turbo run build --filter=open-tag...

      - name: Resolve deterministic pack coordinates
        id: version
        run: |
          SOURCE_NAME=$(node -p "require('./apps/cli/package.json').name")
          SOURCE_VERSION=$(node -p "require('./apps/cli/package.json').version")
          SOURCE_BINARY=$(node -p "Object.keys(require('./apps/cli/package.json').bin)[0]")
          printf 'source_name=%s\nsource_version=%s\nsource_binary=%s\n' \
            "$SOURCE_NAME" "$SOURCE_VERSION" "$SOURCE_BINARY" >> "$GITHUB_OUTPUT"
          node scripts/release-versions.mjs \
            --channel staging \
            --source-version "$SOURCE_VERSION" \
            --sequence "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Smoke source tarball
        run: >-
          node scripts/cli-pack-smoke.mjs
          --channel source
          --name "${{ steps.version.outputs.source_name }}"
          --version "${{ steps.version.outputs.source_version }}"
          --binary "${{ steps.version.outputs.source_binary }}"

      - name: Prepare deterministic staging identity
        run: >-
          node scripts/prepare-cli-release.mjs
          --channel staging
          --version "${{ steps.version.outputs.version }}"

      - name: Rebuild staging CLI
        run: pnpm --dir apps/cli build

      - name: Smoke staging tarball
        run: >-
          node scripts/cli-pack-smoke.mjs
          --channel staging
          --name "${{ steps.version.outputs.package_name }}"
          --version "${{ steps.version.outputs.version }}"
          --binary "${{ steps.version.outputs.binary_name }}"

      - name: Restore and prepare production identity
        run: |
          git checkout -- apps/cli/package.json apps/cli/src/build-info.ts
          node -e '
            const fs = require("node:fs");
            const path = "apps/cli/package.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = "0.0.2";
            fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          '
          node scripts/prepare-cli-release.mjs --channel prod --version 0.0.2

      - name: Rebuild and smoke production CLI
        run: |
          pnpm --dir apps/cli build
          node scripts/cli-pack-smoke.mjs \
            --channel prod \
            --name open-tag \
            --version 0.0.2 \
            --binary opentag

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Build source CLI and dependencies
        run: |
          pnpm install --frozen-lockfile --config.engine-strict=true
          pnpm exec turbo run build --filter=open-tag...

      - name: Build image
        run: docker build --tag opentag-server:ci .

      - name: Start PostgreSQL
        run: |
          docker network create opentag-ci
          docker run --detach --name opentag-postgres-ci --network opentag-ci \
            --env POSTGRES_DB=opentag \
            --env POSTGRES_USER=opentag \
            --env POSTGRES_PASSWORD=opentag \
            postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec opentag-postgres-ci pg_isready --username opentag --dbname opentag; then
              exit 0
            fi
            sleep 1
          done
          docker logs opentag-postgres-ci
          exit 1

      - name: Start container
        run: >-
          docker run --detach --name opentag-server-ci --network opentag-ci --publish 18000:8000
          --env OPENTAG_DATABASE_URL=postgresql://opentag:opentag@opentag-postgres-ci:5432/opentag
          --env OPENTAG_JWT_SECRET=ci-only-secret-that-is-at-least-32-characters
          --env OPENTAG_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          --env OPENTAG_PUBLIC_URL=https://localhost:18000
          opentag-server:ci

      - name: Wait for readiness endpoint
        run: |
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent http://127.0.0.1:18000/readyz); then
              node -e '
                const readiness = JSON.parse(process.argv[1]);
                if (readiness.status !== "ready") {
                  throw new Error(`Unexpected readiness response: ${process.argv[1]}`);
                }
              ' "$response"
              exit 0
            fi
            sleep 1
          done
          docker logs opentag-server-ci
          exit 1

      - name: Smoke production administration entrypoints and Computer runtime
        run: |
          curl --fail --silent http://127.0.0.1:18000/admin/ | grep -q "OpenTag Admin"
          node -e '
            const response = await fetch("http://127.0.0.1:18000/api/v1/not-a-route");
            const body = await response.text();
            if (response.status !== 404 || body.includes("OpenTag Admin")) {
              throw new Error("Admin SPA fallback captured an API route");
            }
          '
          docker exec opentag-server-ci node packages/server/dist/db/migrate-cli.mjs
          bootstrap=$(docker exec \
            --env OPENTAG_BOOTSTRAP_EMAIL=admin@example.com \
            --env OPENTAG_BOOTSTRAP_DISPLAY_NAME=Admin \
            --env OPENTAG_BOOTSTRAP_TEAM_NAME=example \
            --env OPENTAG_BOOTSTRAP_TEAM_DISPLAY_NAME=Example \
            opentag-server-ci node packages/server/dist/admin/bootstrap-cli.mjs)
          connect_code=$(node -e '
            const result = JSON.parse(process.argv[1]);
            if (!result.userId || !result.teamId || !result.connectCode || !result.expiresAt) {
              throw new Error("Bootstrap output is incomplete");
            }
            process.stdout.write(result.connectCode);
          ' "$bootstrap")

          runtime_home=$(mktemp -d)
          daemon_log="$runtime_home/daemon.log"
          cleanup_runtime() {
            if [ -n "${daemon_pid:-}" ] && kill -0 "$daemon_pid" 2>/dev/null; then
              kill -TERM "$daemon_pid" || true
              wait "$daemon_pid" || true
            fi
          }
          trap cleanup_runtime EXIT
          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs \
            login "$connect_code" --server http://127.0.0.1:18000 --no-start
          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs daemon service-run >"$daemon_log" 2>&1 &
          daemon_pid=$!

          for attempt in $(seq 1 30); do
            if OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs computer list | grep -q $'\tonline\t'; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat "$daemon_log"
              exit 1
            fi
            sleep 1
          done
          OPENTAG_HOME="$runtime_home" timeout 5s node apps/cli/dist/cli/index.mjs daemon service-run \
            >"$runtime_home/second.log" 2>&1
          grep -q "already running" "$runtime_home/second.log"
          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs computer list | grep -q $'\tonline\t'
          computer_id=$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).computerId" \
            "$runtime_home/computer.json")

          agent_create=$(OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs agent create \
            --team example \
            --name ci-agent \
            --display-name "CI Agent" \
            --provider codex \
            --computer "$computer_id")
          agent_id=$(printf '%s\n' "$agent_create" | awk '{print $3}')
          test -n "$agent_id"
          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs agent list --team example | grep -q "$agent_id"
          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs agent show "$agent_id" | grep -q $'revision\t1'
          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs agent update "$agent_id" \
            --display-name "Updated CI Agent" | grep -q $'revision\t2'
          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs agent delete "$agent_id" | grep -q "$agent_id"
          test "$(OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs agent list --team example)" = \
            "No Agents registered"

          kill -INT "$daemon_pid"
          wait "$daemon_pid"
          unset daemon_pid
          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs computer list | grep -q $'\toffline\t'

          OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs daemon service-run >"$daemon_log" 2>&1 &
          daemon_pid=$!
          for attempt in $(seq 1 30); do
            if list=$(OPENTAG_HOME="$runtime_home" node apps/cli/dist/cli/index.mjs computer list) && \
              printf '%s\n' "$list" | grep -q "$computer_id" && printf '%s\n' "$list" | grep -q $'\tonline\t'; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat "$daemon_log"
              exit 1
            fi
            sleep 1
          done
          kill -INT "$daemon_pid"
          wait "$daemon_pid"
          unset daemon_pid
          trap - EXIT

      - name: Verify runtime boundary
        run: |
          test "$(docker inspect --format '{{.Config.User}}' opentag-server-ci)" = "opentag"
          if docker exec opentag-server-ci test -e /app/apps/cli; then
            echo "CLI artifact must not be present in the server image" >&2
            exit 1
          fi
          docker exec opentag-server-ci test -f /app/LICENSE

      - name: Stop container
        if: always()
        run: |
          docker rm --force opentag-server-ci || true
          docker rm --force opentag-postgres-ci || true
          docker network rm opentag-ci || true

  ci:
    name: CI
    if: always()
    needs:
      - checks
      - node-compatibility
      - cli-pack-smoke
      - container-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          NODE_COMPATIBILITY_RESULT: ${{ needs.node-compatibility.result }}
          CLI_PACK_RESULT: ${{ needs.cli-pack-smoke.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: |
          for result in "$CHECKS_RESULT" "$NODE_COMPATIBILITY_RESULT" "$CLI_PACK_RESULT" "$CONTAINER_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
