# The marketplace category set.
#
# Every category declared here must be referenced by at least one entry in `mcp-catalog.yaml`, and
# every entry's `category` must name one of these ids — `pnpm check` fails either way, so the tab bar
# never shows a tab that leads nowhere.
#
# `label` must supply every locale listed in `apps/web/project.inlang/settings.json`. A missing locale
# fails the build rather than falling back to another at render time.
# `order` sets the tab order.

- id: general
  label:
    en: General
    zh: 通用
  order: 10

- id: engineering
  label:
    en: Engineering
    zh: 工程
  order: 20

- id: google-workspace
  label:
    en: Google Workspace
    zh: Google Workspace
  order: 30

- id: business-data
  label:
    en: Business & Data
    zh: 业务与数据
  order: 80
