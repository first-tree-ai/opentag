services:
  postgres:
    image: postgres:17
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: opentag
      POSTGRES_USER: opentag
      POSTGRES_PASSWORD: opentag
    ports:
      - "${OPENTAG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - opentag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentag -d opentag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  opentag-postgres-data:
